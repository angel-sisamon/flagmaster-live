# Regenera y publica la web de clasificaciones cada vez que se sube un directo (data/) o cambia la web.
# Los JSON de site/data/ se generan aquí a partir de data/sessions: no se guardan en el repo.
name: Web de clasificaciones

on:
  push:
    branches: [main]
    paths: ['data/**', 'site/**', 'shared/**', 'scripts/aggregate.js', 'test/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin npm install: el agregador y sus tests no tienen dependencias
      - run: node --test "test/stats.test.js"
      - run: node scripts/aggregate.js
        env:
          LIVE_TZ: Europe/Madrid
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
